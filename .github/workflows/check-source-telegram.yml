name: Check source Telegram access
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: source-telegram-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arabic and English OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Install test and Telegram dependencies
        run: pip install "Telethon>=1.34,<2" pytest Pillow "pytesseract>=0.3.13,<1"
      - name: Run offline parser and duplicate-protection tests
        run: python -m pytest -q tests/test_source_processor.py tests/test_source_pipeline.py
      - name: Inspect recent source posts and OCR photos without publishing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/inspect_source_samples.py
      - name: Upload read-only OCR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-inspection-report
          path: artifacts/source-inspection.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify account and channel access without publishing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/check_telegram_connection.py
