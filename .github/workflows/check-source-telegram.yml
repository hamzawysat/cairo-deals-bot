name: Source Telegram review checks
on:
  pull_request:
    paths:
      - "scripts/build_source_offer_previews.py"
      - "src/source_offer.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/check-source-telegram.yml"
  workflow_dispatch:
    inputs:
permissions:
  contents: read
concurrency:
  group: source-offer-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore source offer duplicate state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/source-offer-state.json
          key: ${{ runner.os }}-source-offer-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-source-offer-state-
      - name: Install Arabic and English OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-noto-core
      - name: Install project dependencies and test runner
        run: pip install -r requirements.txt pytest
      - name: Run complete offline test suite
        run: python -m pytest -q
      - name: Build review-only previews from source Telegram posts
        env:
          SOURCE_TELEGRAM_CHANNEL: "@OffersEgyptofficial"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/build_source_offer_previews.py
      - name: Save source offer delivery state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/source-offer-state.json
          key: ${{ runner.os }}-source-offer-state-${{ github.run_id }}
      - name: Upload source offer preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-offer-previews
          path: artifacts/source-offer-previews.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Telegram account and channel access without publishing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/check_telegram_connection.py
