name: Check source Telegram access
on:
  workflow_dispatch:
  push:
    branches:
      - source-monitor
permissions:
  contents: read
concurrency:
  group: source-telegram-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-monitor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and Telegram dependencies
        run: pip install "Telethon>=1.34,<2" pytest
      - name: Run offline parser and duplicate-protection tests
        run: python -m pytest -q tests/test_source_processor.py
      - name: Verify account and channel access without publishing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/check_telegram_connection.py
