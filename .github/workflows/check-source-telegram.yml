name: Cron-triggered source offer monitoring and publishing
on:
  workflow_dispatch:
    inputs:
      publish_one:
        description: "Publish exactly one manually selected and reviewed source offer"
        required: false
        type: boolean
        default: false
      source_message_id:
        description: "Exact source post ID reviewed for this one-time publication"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: source-offer-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore source offer duplicate state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/source-offer-state.json
          key: ${{ runner.os }}-source-offer-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-source-offer-state-
      - name: Install Arabic and English OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Install project dependencies and test runner
        run: pip install -r requirements.txt pytest
      - name: Run complete offline test suite
        run: python -m pytest -q
      - name: Build review-only previews from source Telegram posts
        env:
          SOURCE_TELEGRAM_CHANNEL: "@OffersEgyptofficial"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/build_source_offer_previews.py
      - name: Automatically publish queued Amazon offers
        if: ${{ github.event_name == 'workflow_dispatch' && vars.SOURCE_AUTO_PUBLISH_ENABLED == 'true' }}
        env:
          SOURCE_AUTO_PUBLISH_ENABLED: ${{ vars.SOURCE_AUTO_PUBLISH_ENABLED }}
          TARGET_TELEGRAM_CHANNEL: "@cairo_deals"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/publish_pending_source_offers.py
      - name: Publish exactly one reviewed offer (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_one == true }}
        env:
          SOURCE_PUBLISH_ENABLED: ${{ inputs.publish_one }}
          TARGET_TELEGRAM_CHANNEL: "@cairo_deals"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
        run: python scripts/publish_one_source_offer.py
      - name: Save source offer delivery state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/source-offer-state.json
          key: ${{ runner.os }}-source-offer-state-${{ github.run_id }}
      - name: Upload source offer preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-offer-previews
          path: artifacts/source-offer-previews.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Telegram account and channel access without publishing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/check_telegram_connection.py
