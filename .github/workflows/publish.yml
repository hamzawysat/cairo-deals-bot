name: Publish affiliate offer
on:
  workflow_dispatch:
  schedule:
    # Temporary cadence test: GitHub Actions supports scheduled runs no faster than every 5 minutes.
    # src/main.py still enforces the configured minimum interval between Telegram posts.
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: cairo-deals-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore duplicate protection state
        uses: actions/cache@v4
        with:
          path: data/state.sqlite3
          key: cairo-deals-state-${{ github.run_id }}
          restore-keys: cairo-deals-state-
      - run: pip install -r requirements.txt pytest
      - name: Discover permitted RSS candidates
        run: python -m src.discovery
      - name: Run tests
        run: python -m pytest -q
      - name: Publish one eligible offer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m src.main
